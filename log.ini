; glacc (给梨加速器) DevEnvHelperNS 后门配置
; 读取者: DevEnvHelperNS.getADUrl/getBannerUrl/isLogEnable/isDevToolsEnable/getADVip
; 路径写死: C:\ETW_LOG\log.ini
; - [Log] enable=1  -> F12 / Ctrl+Alt+T 可开 DevTools
; - [AD]   url=...  -> 任务中心"看广告"窗口加载该 URL 代替官方 mercuryh5 页面
; - [AD]   banner=.. -> 首页 banner H5 同理
; - [AD]   vip=1    -> getADVip() 开关

[Log]
enable=1
output=1

[AD]
url=http://localhost:3000/index.html
banner=http://localhost:3000/index.html
vip=1
