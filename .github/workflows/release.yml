name: Build & Release

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

concurrency:
  group: release-by-commit-message
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build TokenHub.exe
        shell: pwsh
        run: |
          go vet ./...
          # 注入 commit 短哈希：自动更新用它与 release tag 比对（缺了会按 dev 构建跳过自更新）
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          go build -ldflags "-s -w -H windowsgui -X tokenhub/internal/config.GitCommit=$sha" -o TokenHub.exe .

      - name: Build TokenHub-linux-amd64
        shell: pwsh
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          go build -trimpath -ldflags "-s -w -X tokenhub/internal/config.GitCommit=$sha" -o TokenHub-linux-amd64 .

      - name: Prepare tag name from commit message
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          RAW_FIRST_LINE="$(printf "%s" "${{ github.event.head_commit.message }}" | head -n 1 | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"

          CLEAN="$(printf "%s" "$RAW_FIRST_LINE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g' \
            | sed -E 's/-+/-/g' \
            | sed -E 's/^-+|-+$//g' \
            | cut -c1-40)"

          if [ -z "$CLEAN" ]; then
            CLEAN="release"
          fi

          SHORT_SHA="$(printf "%s" "${GITHUB_SHA}" | cut -c1-7)"
          TAG="${CLEAN}-${SHORT_SHA}"

          echo "raw_first_line=$RAW_FIRST_LINE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skip creating."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          if [ ! -f TokenHub.exe ]; then
            echo "TokenHub.exe not found. Build may have failed."
            ls -la || true
            exit 1
          fi

          cp TokenHub.exe dist/
          if [ -f TokenHub-linux-amd64 ]; then
            cp TokenHub-linux-amd64 dist/
            # 部署包：二进制 + start.sh（自动 chmod+启动）+ README-LINUX.txt
            tar -czf dist/TokenHub-linux-amd64.tar.gz TokenHub-linux-amd64 -C scripts/linux-bundle start.sh README-LINUX.txt
          else
            echo "TokenHub-linux-amd64 not found (non-fatal)."
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.raw_first_line }}
          generate_release_notes: true
          files: |
            dist/*
