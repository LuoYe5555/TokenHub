<title>TokenHub</title>
<link rel="icon" href="/favicon.svg" data-page-node-id="rOiE0OuzBrjchH2G3Mtsdc">
<style>
:root{
  --bg:#0e1014; --panel:#14171d; --card:#191d26; --card2:#1f2430;
  --border:#272d3a; --text:#e7eaf0; --muted:#8b93a5; --accent:#4f8cff;
  --accent2:#6ea1ff; --green:#3ad98a; --amber:#f2b544; --red:#f36c6c;
  --radius:12px; --mono:'Cascadia Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,'Segoe UI','Microsoft YaHei',Roboto,'Noto Sans SC',sans-serif;
  font-size:14px; display:flex; overflow:hidden;
}
/* ── 侧栏 ── */
#sidebar{
  width:216px; min-width:216px; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:16px 12px; gap:4px;
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo img{width:30px;height:30px;border-radius:8px}
.logo .name{font-size:17px;font-weight:700;letter-spacing:.3px}
.logo .name span{color:var(--accent)}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  color:var(--muted);cursor:pointer;user-select:none;font-weight:500;border:1px solid transparent;
}
.nav-item:hover{color:var(--text);background:var(--card)}
.nav-item.active{color:var(--text);background:var(--card2);border-color:var(--border)}
.nav-item .ico{width:18px;text-align:center}
.side-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.lang-row{display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);font-size:12px}
select,input[type=text],input[type=password],input[type=number],textarea{
  background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:7px 10px;font-size:13px;outline:none;width:100%;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
.ver{padding:0 10px;color:var(--muted);font-size:11px}
/* ── 主区 ── */
#main{flex:1;overflow-y:auto;padding:26px 30px 60px}
.page{display:none;max-width:1060px;margin:0 auto}
.page.active{display:block}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat .label{color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.stat .num{font-size:26px;font-weight:700}
.stat .num small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--green)} .dot.off{background:var(--muted)}
.pico{width:20px;height:20px;border-radius:6px;vertical-align:-4px;margin-right:2px}
h2 .pico{width:22px;height:22px;border-radius:7px;vertical-align:-5px}
/* 按钮 */
button{
  background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:7px 14px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent2)}
button.danger:hover{border-color:var(--red);color:var(--red)}
button.ghost{background:transparent}
button.sm{padding:4px 10px;font-size:12px;border-radius:7px}
button:disabled{opacity:.5;cursor:not-allowed}
/* 账号卡片 */
.acct{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap}
.acct .avatar{width:38px;height:38px;border-radius:10px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--accent2)}
.acct .info{flex:1;min-width:230px}
.acct .name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acct .meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.badge.ok{color:var(--green);border-color:rgba(58,217,138,.4)}
.badge.warn{color:var(--amber);border-color:rgba(242,181,68,.4)}
.badge.err{color:var(--red);border-color:rgba(243,108,108,.4)}
.badge.acc{color:var(--accent2);border-color:rgba(79,140,255,.4)}
.quota{margin-top:8px}
.quota .bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:4px}
.quota .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.quota .txt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* section */
.sec{margin-bottom:26px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h2{font-size:16px;display:flex;align-items:center;gap:8px}
/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:560px;max-width:92vw;
  max-height:86vh;overflow-y:auto;padding:20px 22px}
.modal h3{margin-bottom:14px;font-size:16px}
.modal .field{margin-bottom:12px}
.modal label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0}
.pill-steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pill-steps .step{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.55}
.pill-steps .step b{color:var(--accent2)}
/* API 页 */
.codebox{background:#0c0e12;border:1px solid var(--border);border-radius:9px;padding:12px 14px;
  font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;color:#c9d4e8;position:relative}
.codebox .copy{position:absolute;top:8px;right:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--mono);font-size:11.5px;background:var(--card2);border:1px solid var(--border);
  border-radius:6px;padding:3px 8px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.keyline{display:flex;gap:8px;align-items:center}
.keyline input{font-family:var(--mono)}
.fmt-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.fmt-row select{flex:none;max-width:250px;font-size:12px}
.fmt-row input{flex:1;font-family:var(--mono);font-size:12px}
.utable{width:100%;border-collapse:collapse;font-size:12px}
.utable th{color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.utable td{padding:6px 8px;border-bottom:1px dashed var(--border);white-space:nowrap;vertical-align:top}
.utable tr:last-child td{border-bottom:none}
/* 日志 */
#logsBox{background:#0c0e12;border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;height:62vh;overflow-y:auto;font-family:var(--mono);font-size:12px;line-height:1.7}
#logsBox .l{display:flex;gap:10px;align-items:flex-start}
#logsBox .t{color:#5b6474;flex:0 0 148px;white-space:nowrap}
#logsBox .tag{color:var(--accent2);flex:0 0 88px;white-space:nowrap}
#logsBox .lv-warn{color:var(--amber)} #logsBox .lv-error{color:var(--red)} #logsBox .lv-info{color:#9aa5b8}
#logsBox .m{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all;color:#c9d4e8}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--border);border-radius:10px;padding:10px 18px;display:none;z-index:99;font-size:13px}
#toast.show{display:block}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
.tabs-mini{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs-mini button{border-radius:8px}
.tabs-mini button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .d{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.setting-row .ctl{min-width:180px;max-width:300px}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.switch i:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--muted);top:3px;left:3px;transition:.2s}
.switch input:checked+i{background:rgba(79,140,255,.25);border-color:var(--accent)}
.switch input:checked+i:before{transform:translateX(18px);background:var(--accent)}
/* 分享钥匙 */
.share-item{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;background:var(--card2)}
.share-item .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.share-item .head .nm{font-weight:600;min-width:80px}
.share-item .head .share-key{flex:1;min-width:220px;max-width:340px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
/* 提供商配置行（钥匙条目 + 创建区共用网格） */
.prow{display:grid;grid-template-columns:158px 42px 84px 110px 1fr max-content;gap:8px 12px;align-items:center;padding:9px 0;font-size:12.5px}
.prow + .prow{border-top:1px dashed var(--border)}
.prow .pvn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .lbl{color:var(--muted);white-space:nowrap}
.prow .used{color:var(--muted);white-space:nowrap;text-align:right;font-size:12px}
.prow input[type=number],.prow input[type=text]{width:100%}
.share-provs{border-top:1px dashed var(--border);margin-top:10px;padding-top:2px}
#shareCreate .cname{color:var(--muted);font-size:12px;margin:12px 0 5px}
#shareCreate .cfoot{display:flex;justify-content:flex-end;margin-top:10px}
</style>
